name: Diagnose upright т and handwriting font variants
on:
  push:
    paths:
      - ".github/workflows/font-connection-diagnostic.yml"
      - "fonts/**"
      - "scripts/diagnose-font-variants.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font inspection and rendering libraries
        run: python -m pip install fonttools brotli pillow
      - name: Inspect OpenType alternates and render A/B comparison
        run: python scripts/diagnose-font-variants.py
      - uses: actions/upload-artifact@v4
        with:
          name: font-connection-diagnostic
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
