name: Temporary font export
on:
  push:
    paths:
      - "fonts/BambuHandWriteOriginal.woff2"
      - ".github/workflows/font-export-temp.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: bambu-original-font
          path: fonts/BambuHandWriteOriginal.woff2
          retention-days: 1
