name: Export Bambu HandWrite font specimens
on:
  push:
    paths:
      - ".github/workflows/export-bambu-font.yml"
      - "fonts/BambuHandWriteOriginal.woff2"
      - "fonts/Pecita.otf"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export and inspect
        run: |
          python -m pip install --upgrade fonttools brotli pillow
          mkdir -p dist
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.woff2 import decompress
          from PIL import Image, ImageDraw, ImageFont
          from shutil import copyfile
          required = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя"
          def specimen(font_path, title, out):
              f = ImageFont.truetype(font_path, 60)
              img = Image.new("RGB", (1900, 760), "white")
              d = ImageDraw.Draw(img)
              lines = [
                  title,
                  "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ",
                  "абвгдеёжзийклмнопрстуфхцчшщъыьэюя",
                  "Мама мыла раму. Самолёт летит высоко.",
                  "Тетрадь, ручка, авиация, скорость и техника."
              ]
              for i, line in enumerate(lines):
                  d.text((30, 20 + i*135), line, font=f, fill="black")
              img.save(out)
          decompress("fonts/BambuHandWriteOriginal.woff2", "dist/BambuHandWriteOriginal.ttf")
          copyfile("fonts/Pecita.otf", "dist/PecitaSchool.otf")
          report = []
          for name, path in [("Original", "dist/BambuHandWriteOriginal.ttf"), ("PecitaSchool", "dist/PecitaSchool.otf")]:
              ft = TTFont(path)
              cmap = set().union(*(set(t.cmap) for t in ft["cmap"].tables if t.isUnicode()))
              missing = [c for c in required if ord(c) not in cmap]
              report.append(f"{name}: glyphs={len(ft.getGlyphOrder())}, missing Cyrillic={missing}")
              specimen(path, name + " — проверка кириллицы", "dist/" + name + "-specimen.png")
          open("dist/coverage.txt", "w", encoding="utf-8").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bambu-font-export
          path: dist/
          if-no-files-found: error
          retention-days: 7
