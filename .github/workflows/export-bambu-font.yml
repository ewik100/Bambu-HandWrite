name: Build Bambu HandWrite School font
on:
  push:
    paths:
      - ".github/workflows/export-bambu-font.yml"
      - "fonts/Caveat[wght].ttf.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable and web fonts
        run: |
          python -m pip install --upgrade fonttools brotli pillow
          mkdir -p dist
          curl -fsSL https://raw.githubusercontent.com/googlefonts/caveat/main/OFL.txt -o dist/OFL.txt
          python - <<'PY'
          import base64
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          source = Path("fonts/Caveat[wght].ttf.b64").read_bytes()
          Path("dist/source-variable.ttf").write_bytes(base64.b64decode(source))
          variable = TTFont("dist/source-variable.ttf")
          font = instantiateVariableFont(variable, {"wght": 400}, inplace=False)
          replacements = {
              1: "Bambu HandWrite School",
              2: "Regular",
              3: "BambuHandWriteSchool-Regular-1.0",
              4: "Bambu HandWrite School Regular",
              6: "BambuHandWriteSchool-Regular",
              16: "Bambu HandWrite School",
              17: "Regular",
              18: "Bambu HandWrite School Regular",
          }
          for name_id, value in replacements.items():
              font["name"].setName(value, name_id, 3, 1, 0x409)
              font["name"].setName(value, name_id, 1, 0, 0)
          font["head"].fontRevision = 1.0
          font["OS/2"].usWeightClass = 400
          from copy import deepcopy
          from fontTools.feaLib.builder import addOpenTypeFeaturesFromString
          pre_path = "dist/BambuHandWriteSchool-pre-calt.ttf"
          font.save(pre_path)
          source_font = TTFont(pre_path)
          temp_font = TTFont(pre_path)
          cmap = source_font.getBestCmap()
          glyph_order = set(source_font.getGlyphOrder())
          codepoints = list(range(0x410, 0x430)) + [0x401] + list(range(0x430, 0x450)) + [0x451]
          base_names = []
          for cp in codepoints:
              name = cmap.get(cp)
              if name and name not in base_names:
                  base_names.append(name)
          varied_names = [name for name in base_names if name + ".ss01" in glyph_order and name + ".ss02" in glyph_order]
          previous_names = []
          for name in base_names:
              for candidate in (name, name + ".ss01", name + ".ss02"):
                  if candidate in glyph_order and candidate not in previous_names:
                      previous_names.append(candidate)
          if len(varied_names) < 20:
              raise SystemExit("Not enough Cyrillic alternate glyph pairs: " + str(len(varied_names)))
          fea = ["languagesystem cyrl dflt;",
                 "@CYR_PREV = [" + " ".join(previous_names) + "];",
                 "@CYR_SS01 = [" + " ".join(name + ".ss01" for name in varied_names) + "];",
                 "@CYR_SS02 = [" + " ".join(name + ".ss02" for name in varied_names) + "];",
                 "feature calt {"]
          for name in varied_names:
              fea.append("  sub @CYR_PREV " + name + "' by " + name + ".ss01;")
              fea.append("  sub @CYR_SS01 " + name + "' by " + name + ".ss02;")
              fea.append("  sub @CYR_SS02 " + name + "' by " + name + ".ss01;")
          fea.append("} calt;")
          addOpenTypeFeaturesFromString(temp_font, "\n".join(fea))
          original_gsub = source_font["GSUB"].table
          added_gsub = temp_font["GSUB"].table
          calt_index = next(i for i, record in enumerate(original_gsub.FeatureList.FeatureRecord) if record.FeatureTag == "calt")
          added_calt_index = next(i for i, record in enumerate(added_gsub.FeatureList.FeatureRecord) if record.FeatureTag == "calt")
          target_calt = original_gsub.FeatureList.FeatureRecord[calt_index].Feature
          lookup_offset = len(original_gsub.LookupList.Lookup)
          def shift_lookup_refs(obj, offset, seen=None):
              if seen is None: seen = set()
              if obj is None or id(obj) in seen: return
              if isinstance(obj, list):
                  seen.add(id(obj))
                  for item in obj: shift_lookup_refs(item, offset, seen)
                  return
              if not hasattr(obj, "__dict__"): return
              seen.add(id(obj))
              records = getattr(obj, "SubstLookupRecord", None)
              if records:
                  for record in records: record.LookupListIndex += offset
              for key, value in obj.__dict__.items():
                  if key != "SubstLookupRecord" and (isinstance(value, list) or hasattr(value, "__dict__")):
                      shift_lookup_refs(value, offset, seen)
          for lookup in added_gsub.LookupList.Lookup:
              copied = deepcopy(lookup)
              shift_lookup_refs(copied, lookup_offset)
              original_gsub.LookupList.Lookup.append(copied)
              target_calt.LookupListIndex.append(lookup_offset)
              lookup_offset += 1
          original_gsub.LookupList.LookupCount = len(original_gsub.LookupList.Lookup)
          target_calt.LookupCount = len(target_calt.LookupListIndex)
          from fontTools.ttLib.tables import otTables
          scripts = original_gsub.ScriptList.ScriptRecord
          dflt_record = next((record for record in scripts if record.ScriptTag == "DFLT"), None)
          defaults = list(dflt_record.Script.DefaultLangSys.FeatureIndex) if dflt_record and dflt_record.Script.DefaultLangSys else []
          cyrl_record = next((record for record in scripts if record.ScriptTag == "cyrl"), None)
          if cyrl_record is None:
              script = otTables.Script()
              script.LangSysRecord = []
              script.LangSysCount = 0
              cyrl_record = otTables.ScriptRecord()
              cyrl_record.ScriptTag = "cyrl"
              cyrl_record.Script = script
              scripts.append(cyrl_record)
          lang = otTables.LangSys()
          lang.LookupOrder = None
          lang.ReqFeatureIndex = 0xFFFF
          lang.FeatureIndex = sorted(set(defaults + [calt_index]))
          lang.FeatureCount = len(lang.FeatureIndex)
          cyrl_record.Script.DefaultLangSys = lang
          cyrl_record.Script.LangSysRecord = cyrl_record.Script.LangSysRecord or []
          cyrl_record.Script.LangSysCount = len(cyrl_record.Script.LangSysRecord)
          scripts.sort(key=lambda record: record.ScriptTag)
          original_gsub.ScriptList.ScriptCount = len(scripts)
          source_font["GSUB"].table = original_gsub
          font = source_font
          ttf_path = "dist/BambuHandWriteSchool-Regular.ttf"
          font.save(ttf_path)
          webfont = TTFont(ttf_path)
          webfont.flavor = "woff2"
          webfont.save("dist/BambuHandWriteSchool-Regular.woff2")
          check = TTFont(ttf_path)
          cmap = set().union(*(set(t.cmap) for t in check["cmap"].tables if t.isUnicode()))
          required = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя"
          missing = [c for c in required if ord(c) not in cmap]
          features = sorted({r.FeatureTag for r in check["GSUB"].table.FeatureList.FeatureRecord}) if "GSUB" in check else []
          script_tags = {r.ScriptTag for r in check["GSUB"].table.ScriptList.ScriptRecord} if "GSUB" in check else set()
          if missing:
              raise SystemExit("Missing Cyrillic: " + repr(missing))
          if not {"ss01", "ss02", "calt"}.issubset(features) or "cyrl" not in script_tags:
              raise SystemExit("Expected Cyrillic contextual alternates not present: " + repr(features) + " scripts=" + repr(script_tags))
          from PIL import ImageChops
          sample = "Мама мыла раму. Тетрадь и ручка. Машина летит высоко."
          sample_a = Image.new("L", (1800, 180), 255)
          sample_b = Image.new("L", (1800, 180), 255)
          ImageDraw.Draw(sample_a).text((12, 12), sample, font=ImageFont.truetype(ttf_path, 68, layout_engine=ImageFont.Layout.RAQM), fill=0, features=["calt"])
          ImageDraw.Draw(sample_b).text((12, 12), sample, font=ImageFont.truetype(ttf_path, 68, layout_engine=ImageFont.Layout.RAQM), fill=0, features=["-calt"])
          if ImageChops.difference(sample_a, sample_b).getbbox() is None:
              raise SystemExit("Cyrillic calt did not create visible glyph changes")
          specimen = Image.new("RGB", (1900, 780), "white")
          draw = ImageDraw.Draw(specimen)
          sample_font = ImageFont.truetype(ttf_path, 62)
          lines = [
              "Bambu HandWrite School — проверка",
              "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ",
              "абвгдеёжзийклмнопрстуфхцчшщъыьэюя",
              "Мама мыла раму. Самолёт летит высоко.",
              "Тетрадь, ручка, авиация, скорость и техника.",
              "The quick brown fox jumps over the lazy dog 0123456789."
          ]
          for i, line in enumerate(lines):
              draw.text((30, 20 + i*122), line, font=sample_font, fill="black")
          specimen.save("dist/BambuHandWriteSchool-1.1-specimen.png")
          notes = [
              "Bambu HandWrite School 1.1 — installable TTF and browser WOFF2.",
              "Base design: Caveat by The Caveat Project Authors (Pablo Impallari).",
              "Build: static Regular weight (400), Caveat-based derivative; original ss01/ss02 retained and Cyrillic contextual calt added.",
              "Coverage: all 33 Russian uppercase and lowercase letters including Ё/ё; Latin A-Z/a-z; digits and common punctuation.",
              "Cyrillic calt alternates letters inside words. Universal joining is handled by the Bambu HandWrite app stroke-processing step, not by standalone font shaping.",
              "License: SIL Open Font License 1.1. See OFL.txt."
          ]
          Path("dist/ABOUT.txt").write_text("\n".join(notes) + "\n", encoding="utf-8")
          Path("dist/COVERAGE.txt").write_text(
              "Cyrillic missing: " + repr(missing) + "\n" +
              "Glyph count: " + str(len(check.getGlyphOrder())) + "\n" +
              "OpenType features: " + ", ".join(features) + "\n", encoding="utf-8"
          )
          print("Built", ttf_path, "glyphs", len(check.getGlyphOrder()), "features", features)
          PY
      - name: Straighten lowercase Cyrillic т and verify all variants
        run: |
          python scripts/patch-school-t-glyphs.py dist/BambuHandWriteSchool-Regular.ttf
          python - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont("dist/BambuHandWriteSchool-Regular.ttf")
          font.flavor = "woff2"
          font.save("dist/BambuHandWriteSchool-Regular.woff2")
          PY
          python scripts/diagnose-font-variants.py dist/BambuHandWriteSchool-Regular.woff2
          cp diagnostics/font-variants-A-B-C.png dist/font-variants-A-B-C.png
          cp diagnostics/font-report.json dist/font-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Bambu-HandWrite-School-1.1
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish browser font into the app
        run: |
          cp dist/BambuHandWriteSchool-Regular.woff2 fonts/BambuHandWriteSchool-Regular.woff2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/BambuHandWriteSchool-Regular.woff2
          if ! git diff --cached --quiet; then
            git commit -m "Publish Bambu HandWrite School font with upright т"
            git push
          fi
